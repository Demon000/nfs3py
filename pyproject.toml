[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'nfs3py'
version = '0.1.0'
description = 'A pure-Python, unprivileged, embeddable NFSv3 server'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.10'
authors = [{ name = 'Cosmin Tanislav' }]
classifiers = [
    'Programming Language :: Python :: 3',
    'Intended Audience :: Developers',
    'Topic :: System :: Filesystems',
    'Topic :: System :: Networking',
]

[project.urls]
Homepage = 'https://github.com/Demon000/nfs3py'

[tool.setuptools.packages.find]
include = ['nfs3py*']
